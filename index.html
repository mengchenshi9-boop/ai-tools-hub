            height: 100px;
            border-radius: 24px;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--shadow-lg);
            margin: 0 auto;
            position: relative;
            overflow: hidden;
        }
        
        .card-logo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        
        .card-badges {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 8px;
        }
        
        .card-badge {
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
        }
        
        .card-badge.hot {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            color: white;
        }
        
        .card-badge.new {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
        }
        
        .card-favorite {
            width: 36px;
            height: 36px;
            border-radius: 12px;
            border: 2px solid var(--border);
            background: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            transition: all 0.3s;
            z-index: 2;
        }
        
        .card-favorite:hover {
            transform: scale(1.1);
            border-color: var(--primary);
        }
        
        .card-favorite.active {
            border-color: #ef4444;
            background: #fef2f2;
        }
        
        body.dark-mode .card-favorite {
            background: var(--bg-white);
        }
        
        body.dark-mode .card-favorite.active {
            background: rgba(239, 68, 68, 0.2);
        }
        
        /* Toast 提示 */
        .toast {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: var(--text-primary);
            color: var(--bg-white);
            padding: 14px 28px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 14px;
            box-shadow: var(--shadow-xl);
            z-index: 10000;
            opacity: 0;
            animation: toastSlideUp 0.3s ease forwards;
        }
        
        @keyframes toastSlideUp {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }
        
        /* Card */
        .card-body {
            padding: 28px;
        }
        
        .card-title {
            font-size: 22px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .card-title .rating {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 16px;
        }
        
        .card-title .rating .stars {
            color: var(--warning);
        }
        
        .card-title .rating span:last-child {
            font-weight: 700;
            color: var(--text-primary);
        }
        
        .user-votes {
            font-size: 12px;
            font-weight: 500;
            color: var(--text-light);
        }
        
        .card-desc {
            color: var(--text-secondary);
            font-size: 15px;
            line-height: 1.7;
            margin-bottom: 20px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        
        .card-tags {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }
        
        .card-tag {
            padding: 6px 14px;
            background: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 100%);
            color: var(--text-secondary);
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
        
        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 20px;
            border-top: 1px solid var(--border);
        }
        
        .card-price {
            padding: 8px 20px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 14px;
        }
        
        .card-price.free {
            background: linear-gradient(135deg, #dcfce7 0%, #bbf7d0 100%);
            color: #166534;
        }
        
        .card-price.paid {
            background: linear-gradient(135deg, #dbeafe 0%, #bfdbfe 100%);
            color: #1e40af;
        }
        
        .card-visit {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 12px 24px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            border-radius: 12px;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.3s;
        }
        
        .card-visit:hover {
            background: linear-gradient(135deg, var(--primary-light) 0%, var(--primary) 100%);
            transform: translateX(4px);
        }
        
        .card-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .card-share {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            border: 2px solid var(--border);
            background: var(--bg-white);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            transition: all 0.3s;
        }
        
        .card-share:hover {
            border-color: var(--primary);
            background: var(--bg-light);
            transform: scale(1.1);
        }
        
        /* 加载动画 */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .tools-grid {
            animation: fadeIn 0.5s ease-out;
        }
        
        .tool-card {
            animation: fadeIn 0.5s ease-out;
            animation-fill-mode: both;
        }
        
        .tool-card:nth-child(1) { animation-delay: 0.1s; }
        .tool-card:nth-child(2) { animation-delay: 0.15s; }
        .tool-card:nth-child(3) { animation-delay: 0.2s; }
        .tool-card:nth-child(4) { animation-delay: 0.25s; }
        .tool-card:nth-child(5) { animation-delay: 0.3s; }
        .tool-card:nth-child(6) { animation-delay: 0.35s; }
        
        /* Footer */
        footer {
            background: var(--bg-white);
            border-top: 1px solid var(--border);
            padding: 60px 32px;
            text-align: center;
        }
        
        footer .footer-content {
            max-width: 600px;
            margin: 0 auto;
        }
        
        footer p {
            color: var(--text-secondary);
            margin-bottom: 12px;
            font-size: 15px;
        }
        
        footer .footer-logo {
            font-size: 24px;
            font-weight: 800;
            background: linear-gradient(135deg, #007bff 0%, #00d4ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 20px;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }
        
        /* No Results */
        .no-results {
            text-align: center;
            padding: 100px 32px;
            color: var(--text-secondary);
            grid-column: 1 / -1;
        }
        
        .no-results h2 {
            font-size: 32px;
            margin-bottom: 16px;
            color: var(--text-primary);
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            .tools-section {
                flex-direction: column;
            }
            
            .tools-sidebar {
                width: 100%;
            }
            
            .hero h1 {
                font-size: 36px;
            }
            
            .hero p {
                font-size: 16px;
            }
            
            .hero-stats {
                flex-direction: column;
                gap: 24px;
            }
            
            .tools-grid {
                grid-template-columns: 1fr;
            }
            
            nav {
                display: none;
            }
            
            .card-header {
                padding: 24px;
            }
            
            .card-body {
                padding: 24px;
            }
        }
        
        /* Loading Animation */
        .loading {
            text-align: center;
            padding: 100px;
            color: var(--text-secondary);
        }
        
        .loading::after {
            content: '';
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 3px solid var(--border);
            border-radius: 50%;
            border-top-color: var(--primary);
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>

            { name: "AutoGPT", desc: "自主运行的AI代理，能够自动分解任务并执行，无需人工干预。适合自动化工作流程。", category: "productivity", price: "free", url: "https://autogpt.net", rating: "4.6", domain: "autogpt.net", features: ["自主任务分解", "无需人工干预", "自动化工作流"], hot: true },
            { name: "Replicate", desc: "机器学习模型运行平台，可以运行和微调各种开源AI模型，支持API调用。", category: "code", price: "paid", url: "https://replicate.com", rating: "4.7", domain: "replicate.com", features: ["模型运行", "微调", "API调用"], hot: true },
            { name: "Hugging Face", desc: "AI模型社区，托管数万个开源模型，支持在线试用和下载部署。", category: "code", price: "free", url: "https://huggingface.co", rating: "4.8", domain: "huggingface.co", features: ["模型社区", "在线试用", "下载部署"], hot: true },
            { name: "Jasper AI", desc: "AI营销文案生成工具，适合广告和社交媒体内容，支持品牌语调自定义。", category: "writing", price: "paid", url: "https://jasper.ai", rating: "4.5", domain: "jasper.ai", features: ["营销文案", "品牌语调", "广告生成"] },
            { name: "RunwayML", desc: "AI视频生成和编辑工具，支持文字生成视频、图片生成视频，专业级质量。", category: "video", price: "paid", url: "https://runwayml.com", rating: "4.8", domain: "runwayml.com", features: ["文字生成视频", "图片生成视频", "专业级"] },
            { name: "Playground AI", desc: "免费AI图像生成工具，支持多种模型，包括Stable Diffusion和DALL-E。", category: "image", price: "free", url: "https://playgroundai.com", rating: "4.6", domain: "playgroundai.com", features: ["多模型支持", "SD+DALL-E", "免费使用"] }
        ];
        
        let currentCategory = 'all';
        let searchTerm = '';
        let sortBy = 'default';  // default, rating, hot
        let filterPrice = 'all'; // all, free, paid
        
        const categoryNames = {
            all: '全部',
            chat: 'AI聊天',
            image: '图片生成',
            video: '视频编辑',
            code: '编程开发',
            writing: '写作助手',
            productivity: '效率工具',
            audio: '音频处理',
            design: '设计工具',
            business: '商业办公'
        };
        
        // 使用 Clearbit Logo API 获取官方 Logo
        function getLogoUrl(domain) {
            return `https://logo.clearbit.com/${domain}?size=200`;
        }
        
        function getFaviconUrl(domain) {
            return `https://www.google.com/s2/favicons?domain=${domain}&sz=128`;
        }
        
        function getWeeklyRanking() {
            return tools
                .filter(t => t.hot || t.rating >= 4.8)
                .sort((a, b) => {
                    const aScore = (a.hot ? 2 : 0) + parseFloat(a.rating);
                    const bScore = (b.hot ? 2 : 0) + parseFloat(b.rating);
                    return bScore - aScore;
                })
                .slice(0, 5);
        }
        
        function renderRanking() {
            const rankingList = document.getElementById('rankingList');
            const ranking = getWeeklyRanking();
            
            rankingList.innerHTML = ranking.map((tool, index) => `
                <a href="detail.html?tool=${encodeURIComponent(tool.name)}" class="ranking-item">
                    <div class="ranking-number">
                        <span class="rank-badge ${index < 3 ? 'top-' + (index + 1) : ''}">${index + 1}</span>
                    </div>
                    <div class="ranking-content">
                        <div class="ranking-header">
                            <h3>${tool.name}</h3>
                            <div class="ranking-rating">⭐ ${tool.rating}</div>
                        </div>
                        <p>${tool.desc.substring(0, 80)}...</p>
                        <div class="ranking-tags">
                            <span class="ranking-tag">${categoryNames[tool.category]}</span>
                            ${tool.price === 'free' ? '<span class="ranking-tag free">免费</span>' : '<span class="ranking-tag paid">付费</span>'}
                            ${tool.hot ? '<span class="ranking-tag hot">HOT</span>' : ''}
                        </div>
                    </div>
                </a>
            `).join('');
        }
        
        function renderTools() {
            const grid = document.getElementById('toolsGrid');
            const skeletonLoader = document.getElementById('skeletonLoader');
            
            // 显示骨架屏，隐藏网格
            grid.style.display = 'none';
            skeletonLoader.style.display = 'grid';
            
            // 模拟网络延迟（300ms）展示骨架屏效果
            setTimeout(() => {
                grid.innerHTML = '';
                
                const filtered = tools.filter(tool => {
                    const matchCategory = currentCategory === 'all' || tool.category === currentCategory;
                    const matchSearch = !searchTerm || 
                        tool.name.toLowerCase().includes(searchTerm.toLowerCase()) ||
                        tool.desc.toLowerCase().includes(searchTerm.toLowerCase()) ||
                        categoryNames[tool.category].toLowerCase().includes(searchTerm.toLowerCase());
                    const matchPrice = filterPrice === 'all' || tool.price === filterPrice;
                    return matchCategory && matchSearch && matchPrice;
                });
                
                // 排序
                if (sortBy === 'rating') {
                    filtered.sort((a, b) => parseFloat(b.rating) - parseFloat(a.rating));
                } else if (sortBy === 'hot') {
                    filtered.sort((a, b) => {
                        const aHot = (a.hot ? 2 : 0) + (a.new ? 1 : 0);
                        const bHot = (b.hot ? 2 : 0) + (b.new ? 1 : 0);
                        if (aHot !== bHot) return bHot - aHot;
                        return parseFloat(b.rating) - parseFloat(a.rating);
                    });
                }
                
                document.getElementById('totalTools').textContent = filtered.length + '+';
            
            if (filtered.length === 0) {
                grid.innerHTML = `
                    <div class="no-results">
                        <h2>没有找到匹配的工具</h2>
                        <p>试试其他关键词或分类筛选</p>
                    </div>
                `;
                return;
            }
            
            filtered.forEach(tool => {
                const card = document.createElement('a');
                card.className = 'tool-card';
                card.href = `detail.html?tool=${encodeURIComponent(tool.name)}`;
                
                const badgeHtml = `
                    <div class="card-badges">
                        ${tool.hot ? '<span class="card-badge hot">HOT</span>' : ''}
                        ${tool.new ? '<span class="card-badge new">NEW</span>' : ''}
                        <button class="card-favorite ${isFavorite(tool.name) ? 'active' : ''}" 
                                onclick="event.preventDefault(); toggleFavorite('${tool.name}');"
                                title="收藏">
                            <span>${isFavorite(tool.name) ? '❤️' : '🤍'}</span>
                        </button>
                    </div>
                `;
                
                const stars = '★'.repeat(Math.floor(tool.rating)) + '☆'.repeat(5 - Math.floor(tool.rating));
                const logoUrl = getLogoUrl(tool.domain);
                const faviconUrl = getFaviconUrl(tool.domain);
                
                card.innerHTML = `
                    <div class="card-header">
                        <div class="card-logo" style="background: white;">
                            <img src="${logoUrl}" alt="${tool.name}" loading="lazy" onerror="this.src='${faviconUrl}'">
                        </div>
                        ${badgeHtml}
                    </div>
                    <div class="card-body">
                        <div class="card-title">
                            <h3>${tool.name}</h3>
                            <div class="rating">
                                <span class="stars">${stars}</span>
                                <span>${tool.rating}</span>
                                <span class="user-votes">(${tool.userVotes || 0}人评分)</span>
                            </div>
                        </div>
                        <p class="card-desc">${tool.desc}</p>
                        <div class="card-tags">
                            <span class="card-tag">${categoryNames[tool.category]}</span>
                            ${tool.hot ? '<span class="card-tag">热门</span>' : ''}
                        </div>
                        <div class="card-footer">
                            <span class="card-price ${tool.price}">${tool.price === 'free' ? '免费' : '付费'}</span>
                            <div class="card-actions">
                                <button class="card-share" onclick="event.preventDefault(); shareTool('${tool.name}');" title="分享">
                                    <span>🔗</span>
                                </button>
                                <span class="card-visit">
                                    查看详情 →
                                </span>
                            </div>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
            
            // 隐藏骨架屏，显示网格
            skeletonLoader.style.display = 'none';
            grid.style.display = 'grid';
            }, 300);
        }
        
        // 分类筛选
        document.querySelectorAll('.category-chip').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.category-chip').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentCategory = btn.dataset.category;
                renderTools();
            });
        });
        
        // 搜索功能
        document.getElementById('searchInput').addEventListener('input', (e) => {
            searchTerm = e.target.value.trim();
            renderTools();
        });
        
        // 排序功能
        document.querySelectorAll('[data-sort]').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('[data-sort]').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                sortBy = btn.dataset.sort;
                renderTools();
            });
        });
        
        // 价格筛选
        document.querySelectorAll('[data-price]').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('[data-price]').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                filterPrice = btn.dataset.price;
                renderTools();
            });
        });
        
        // 图片懒加载
        function lazyLoadImages() {
            const images = document.querySelectorAll('img[loading="lazy"]');
            const imageObserver = new IntersectionObserver((entries, observer) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        const img = entry.target;
                        img.src = img.dataset.src || img.src;
                        observer.unobserve(img);
                    }
                });
            }, {
                rootMargin: '100px 0px'
            });
            
            images.forEach(img => imageObserver.observe(img));
        }
        
        // 分享功能
        function shareTool(toolName) {
            const shareUrl = `${window.location.origin}/detail.html?tool=${encodeURIComponent(toolName)}`;
            
            if (navigator.share) {
                navigator.share({
                    title: `${toolName} - 海梦的AI工具宝库`,
                    text: `发现了一个超好用的AI工具：${toolName}`,
                    url: shareUrl
                }).catch(err => console.log('分享失败:', err));
            } else {
                // 降级方案：复制链接
                navigator.clipboard.writeText(shareUrl).then(() => {
                    showToast('链接已复制到剪贴板');
                }).catch(() => {
                    showToast('分享功能暂不支持');
                });
            }
        }
        
        // Toast 提示
        function showToast(message) {
            const existingToast = document.querySelector('.toast');
            if (existingToast) {
                existingToast.remove();
            }
            
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = message;
            document.body.appendChild(toast);
            
            setTimeout(() => {
                toast.style.opacity = '0';
                setTimeout(() => toast.remove(), 300);
            }, 2000);
        }
        
        // 收藏功能
        function getFavorites() {
            const saved = localStorage.getItem('favorites');
            return saved ? JSON.parse(saved) : [];
        }
        
        function isFavorite(toolName) {
            const favorites = getFavorites();
            return favorites.includes(toolName);
        }
        
        function toggleFavorite(toolName) {
            let favorites = getFavorites();
            const index = favorites.indexOf(toolName);
            
            if (index > -1) {
                favorites.splice(index, 1);
                showToast('已取消收藏');
            } else {
                favorites.push(toolName);
                showToast('已添加到收藏');
            }
            
            localStorage.setItem('favorites', JSON.stringify(favorites));
            renderTools(); // 重新渲染更新收藏状态
        }
        
        // Toast 提示
        function showToast(message) {
            const existingToast = document.querySelector('.toast');
            if (existingToast) {
                existingToast.remove();
            }
            
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = message;
            document.body.appendChild(toast);
            
            setTimeout(() => {
                toast.style.opacity = '0';
                setTimeout(() => toast.remove(), 300);
            }, 2000);
        }
        
        // 主题切换功能
        const themeToggle = document.getElementById('themeToggle');
        const themeIcon = document.querySelector('.theme-icon');
        
        // 从 localStorage 读取保存的主题
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'dark') {
            document.body.classList.add('dark-mode');
            themeIcon.textContent = '☀️';
        }
        
        themeToggle.addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            themeIcon.textContent = isDark ? '☀️' : '🌙';
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
        });
        
        // 初始化
        renderRanking();
        renderTools();
        setTimeout(lazyLoadImages, 500); // 渲染后启动懒加载
    </script>
</body>
</html>
