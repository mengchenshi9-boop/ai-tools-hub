        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;

        :root {
            --primary: #007bff;
            --primary-dark: #0056b3;
            --primary-light: #00a8ff;
            --secondary: #00d4ff;
            --accent: #38bdf8;
            --success: #10b981;
            --warning: #ffc107;
            --bg-light: #f8fafc;

            --text-light: #94a3b8;
            --border: #e2e8f0;

            --shadow-md: 0 4px 6px rgba(0,0,0,0.1);
            --shadow-lg: 0 10px 15px rgba(0,0,0,0.1);
            --shadow-xl: 0 20px 25px rgba(0,0,0,0.15);
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-light);
            color: var(--text-primary);
            line-height: 1.6;
            overflow-x: hidden;

        /* Header */
        header {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            padding: 16px 0;
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        
        .header-content {
            max-width: 1440px;
            margin: 0 auto;
            padding: 0 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .logo {
            font-size: 26px;
            font-weight: 800;
            background: linear-gradient(135deg, #007bff 0%, #00d4ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }
        
        .logo span {
            font-size: 32px;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        
        nav {
            display: flex;
            align-items: center;
            gap: 40px;
        }
        
        nav a {
            color: var(--text-secondary);
            text-decoration: none;
            font-weight: 500;
            font-size: 15px;
            transition: all 0.3s;
            position: relative;
        }
        
        nav a::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 0;
            width: 0;
            height: 2px;
            background: var(--primary);
            transition: width 0.3s;
        }
        
        nav a:hover {
            color: var(--primary);
        }
        
        nav a:hover::after {
            width: 100%;
        }
        
        .loading-shimmer {
            background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }
        
        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
        
        .loading-shimmer {
            background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);

            animation: shimmer 1.5s infinite;

        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
        
        /* 骨架屏样式 */
        .skeleton-loader {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 24px;
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px 32px;

        .skeleton-card {

            border-radius: 20px;
            overflow: hidden;
            box-shadow: var(--shadow-md);
        }
        
        .skeleton-header {
            height: 140px;
            background: #f5f5f5;
        }
        
        .skeleton-body {
            padding: 24px;
        }
        
        .skeleton-title {
            height: 32px;
            width: 70%;
            border-radius: 8px;
            margin-bottom: 16px;
        }
        
        .skeleton-desc {
            height: 20px;
            width: 100%;
            border-radius: 6px;
            margin-bottom: 12px;
        }
        
        .skeleton-desc:last-of-type {
            width: 60%;

        /* Skeleton Tags */
        .skeleton-tags {
            height: 32px;
            width: 40%;
            border-radius: 20px;
            margin-top: 20px;

        .theme-icon {
            display: block;
            transition: transform 0.3s;
        }
        
        .theme-toggle:hover .theme-icon {
            transform: scale(1.1);

        /* Hero Section */
        .hero {
            background: linear-gradient(135deg, #007bff 0%, #00d4ff 100%);

            overflow: hidden;
        }
        
        body.dark-mode .hero {
            background: linear-gradient(135deg, #3b82f6 0%, #22d3ee 100%);
        }
        
        .hero::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(circle at 20% 50%, rgba(120, 119, 198, 0.3) 0%, transparent 50%),

        @keyframes float {

            50% { transform: translate(0, -20px); }

        .hero-content {

            max-width: 1440px;

            color: white;

            font-weight: 800;
            margin-bottom: 20px;
            letter-spacing: -1px;
            animation: fadeInUp 0.8s ease;
        }
        
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .hero p {
            font-size: 20px;
            opacity: 0.95;
            margin-bottom: 40px;
            max-width: 700px;
            margin-left: auto;
            margin-right: auto;
            animation: fadeInUp 0.8s ease 0.2s;
        }
        
        .hero-stats {
            display: flex;
            justify-content: center;
            gap: 60px;
            margin-top: 50px;
            animation: fadeInUp 0.8s ease 0.4s;

            background-clip: text;
        }
        
        .hero-stat-label {
            font-size: 14px;
            opacity: 0.8;
            margin-top: 4px;
        }
        
        /* Search Section */
        .search-section {
            background: var(--bg-white);
            padding: 32px;

            border-radius: 16px;
            font-size: 16px;
            font-weight: 500;
            transition: all 0.3s;
            background: var(--bg-light);

            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
            background: white;
        }
        
        .search-icon {
            position: absolute;
            left: 24px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 24px;
            color: var(--text-light);
        }
        
        /* Filter Section */
        .filter-section {
            max-width: 1440px;
            margin: 0 auto;
            padding: 20px 32px;
            background: var(--bg-white);
            border-bottom: 1px solid var(--border);

        .filter-wrapper {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            flex-wrap: wrap;
            gap: 32px;
            align-items: center;
        }
        
        .filter-group {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .filter-label {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-secondary);
        }
        
        .filter-options {
            display: flex;
            gap: 8px;
        }
        
        .filter-option {
            padding: 8px 18px;
            border: 2px solid var(--border);
            background: var(--bg-white);
            border-radius: 10px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            transition: all 0.3s;
            white-space: nowrap;
        }
        
        .filter-option:hover {
            border-color: var(--primary);
            color: var(--primary);
            transform: translateY(-1px);
        }
        
        .filter-option.active {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            border-color: var(--primary);
            color: white;
        }
        
        /* Categories */
        .categories-section {
            max-width: 1440px;
            margin: 40px auto;
            padding: 0 32px;
        }
        
        /* Ranking Section */
        .ranking-section {
            max-width: 1440px;
            margin: 0 auto 40px;
            padding: 0 32px;

        .ranking-container {

            border: 1px solid var(--border);
            box-shadow: var(--shadow-lg);
        }
        
        body.dark-mode .ranking-container {

        .ranking-header {

        .ranking-header p {

            border: 2px solid var(--border);

        }
        
        .ranking-item:hover {

            transform: translateX(8px);

        body.dark-mode .ranking-item {

        .rank-badge.top-3 {

        .ranking-content h3 {

        .ranking-rating {

        .tool-card {
            background: var(--bg-white);
            border-radius: 24px;

            text-decoration: none;
            color: inherit;

            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--primary) 0%, var(--secondary) 100%);

            border-color: var(--primary-light);

        .tool-card:hover::before {

            color: white;

            background: #fef2f2;

        }

            color: var(--bg-white);
            padding: 14px 28px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 14px;
            box-shadow: var(--shadow-xl);
            z-index: 10000;
            opacity: 0;
            animation: toastSlideUp 0.3s ease forwards;
        }
        
        @keyframes toastSlideUp {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }

        .card-body {
            padding: 28px;
        }

            font-weight: 700;
            color: var(--text-primary);

            gap: 12px;

            justify-content: center;

        }

            animation: fadeIn 0.5s ease-out;
        }

        .tool-card:nth-child(3) { animation-delay: 0.2s; }
        .tool-card:nth-child(4) { animation-delay: 0.25s; }
        .tool-card:nth-child(5) { animation-delay: 0.3s; }
        .tool-card:nth-child(6) { animation-delay: 0.35s; }

            text-align: center;
        }

            margin: 0 auto;
        }

            nav {

                padding: 24px;
            }

            }

        }
        
        @keyframes spin {

        // 使用 Clearbit Logo API 获取官方 Logo
        function getLogoUrl(domain) {
            return `https://logo.clearbit.com/${domain}?size=200`;
        }
        
        function getFaviconUrl(domain) {
            return `https://www.google.com/s2/favicons?domain=${domain}&sz=128`;
        }
        
        function getWeeklyRanking() {
            return tools
                .filter(t => t.hot || t.rating >= 4.8)
                .sort((a, b) => {
                    const aScore = (a.hot ? 2 : 0) + parseFloat(a.rating);
                    const bScore = (b.hot ? 2 : 0) + parseFloat(b.rating);
                    return bScore - aScore;
                })
                .slice(0, 5);
        }
        
        function renderRanking() {
            const rankingList = document.getElementById('rankingList');
            const ranking = getWeeklyRanking();
            
            rankingList.innerHTML = ranking.map((tool, index) => `
                <a href="detail.html?tool=${encodeURIComponent(tool.name)}" class="ranking-item">
                    <div class="ranking-number">
                        <span class="rank-badge ${index < 3 ? 'top-' + (index + 1) : ''}">${index + 1}</span>
                    </div>
                    <div class="ranking-content">
                        <div class="ranking-header">
                            <h3>${tool.name}</h3>
                            <div class="ranking-rating">⭐ ${tool.rating}</div>
                        </div>
                        <p>${tool.desc.substring(0, 80)}...</p>
                        <div class="ranking-tags">
                            <span class="ranking-tag">${categoryNames[tool.category]}</span>
                            ${tool.price === 'free' ? '<span class="ranking-tag free">免费</span>' : '<span class="ranking-tag paid">付费</span>'}
                            ${tool.hot ? '<span class="ranking-tag hot">HOT</span>' : ''}
                        </div>
                    </div>
                </a>
            `).join('');
        }
        
        function renderTools() {
            const grid = document.getElementById('toolsGrid');
            const skeletonLoader = document.getElementById('skeletonLoader');
            
            // 显示骨架屏，隐藏网格
            grid.style.display = 'none';
            skeletonLoader.style.display = 'grid';
            
            // 模拟网络延迟（300ms）展示骨架屏效果
            setTimeout(() => {
                grid.innerHTML = '';
                
                const filtered = tools.filter(tool => {
                    const matchCategory = currentCategory === 'all' || tool.category === currentCategory;
                    const matchSearch = !searchTerm || 
                        tool.name.toLowerCase().includes(searchTerm.toLowerCase()) ||
                        tool.desc.toLowerCase().includes(searchTerm.toLowerCase()) ||
                        categoryNames[tool.category].toLowerCase().includes(searchTerm.toLowerCase());
                    const matchPrice = filterPrice === 'all' || tool.price === filterPrice;
                    return matchCategory && matchSearch && matchPrice;
                });
                
                // 排序
                if (sortBy === 'rating') {
                    filtered.sort((a, b) => parseFloat(b.rating) - parseFloat(a.rating));
                } else if (sortBy === 'hot') {
                    filtered.sort((a, b) => {
                        const aHot = (a.hot ? 2 : 0) + (a.new ? 1 : 0);
                        const bHot = (b.hot ? 2 : 0) + (b.new ? 1 : 0);
                        if (aHot !== bHot) return bHot - aHot;
                        return parseFloat(b.rating) - parseFloat(a.rating);
                    });
                }
                
                document.getElementById('totalTools').textContent = filtered.length + '+';
            
            if (filtered.length === 0) {
                grid.innerHTML = `
                    <div class="no-results">
                        <h2>没有找到匹配的工具</h2>
                        <p>试试其他关键词或分类筛选</p>
                    </div>
                `;
                return;
            }
            
            filtered.forEach(tool => {
                const card = document.createElement('a');
                card.className = 'tool-card';
                card.href = `detail.html?tool=${encodeURIComponent(tool.name)}`;
                
                const badgeHtml = `
                    <div class="card-badges">
                        ${tool.hot ? '<span class="card-badge hot">HOT</span>' : ''}
                        ${tool.new ? '<span class="card-badge new">NEW</span>' : ''}
                        <button class="card-favorite ${isFavorite(tool.name) ? 'active' : ''}" 
                                onclick="event.preventDefault(); toggleFavorite('${tool.name}');"
                                title="收藏">
                            <span>${isFavorite(tool.name) ? '❤️' : '🤍'}</span>
                        </button>
                    </div>
                `;
                
                const stars = '★'.repeat(Math.floor(tool.rating)) + '☆'.repeat(5 - Math.floor(tool.rating));
                const logoUrl = getLogoUrl(tool.domain);
                const faviconUrl = getFaviconUrl(tool.domain);
                
                card.innerHTML = `
                    <div class="card-header">
                        <div class="card-logo" style="background: white;">
                            <img src="${logoUrl}" alt="${tool.name}" loading="lazy" onerror="this.src='${faviconUrl}'">
                        </div>
                        ${badgeHtml}
                    </div>
                    <div class="card-body">
                        <div class="card-title">
                            <h3>${tool.name}</h3>
                            <div class="rating">
                                <span class="stars">${stars}</span>
                                <span>${tool.rating}</span>
                                <span class="user-votes">(${tool.userVotes || 0}人评分)</span>
                            </div>
                        </div>
                        <p class="card-desc">${tool.desc}</p>
                        <div class="card-tags">
                            <span class="card-tag">${categoryNames[tool.category]}</span>
                            ${tool.hot ? '<span class="card-tag">热门</span>' : ''}
                        </div>
                        <div class="card-footer">
                            <span class="card-price ${tool.price}">${tool.price === 'free' ? '免费' : '付费'}</span>
                            <div class="card-actions">
                                <button class="card-share" onclick="event.preventDefault(); shareTool('${tool.name}');" title="分享">
                                    <span>🔗</span>
                                </button>
                                <span class="card-visit">
                                    查看详情 →
                                </span>
                            </div>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
            
            // 隐藏骨架屏，显示网格
            skeletonLoader.style.display = 'none';
            grid.style.display = 'grid';
            }, 300);
        }
        
        // 分类筛选
        document.querySelectorAll('.category-chip').forEach(btn => {
            btn.addEventListener('click', () => {

        function lazyLoadImages() {
            const images = document.querySelectorAll('img[loading="lazy"]');
            const imageObserver = new IntersectionObserver((entries, observer) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        const img = entry.target;
                        img.src = img.dataset.src || img.src;
                        observer.unobserve(img);
                    }
                });
            }, {
                rootMargin: '100px 0px'
            });
            
            images.forEach(img => imageObserver.observe(img));
        }
        
        // 分享功能
        function shareTool(toolName) {
            const shareUrl = `${window.location.origin}/detail.html?tool=${encodeURIComponent(toolName)}`;
            
            if (navigator.share) {
                navigator.share({
                    title: `${toolName} - 海梦的AI工具宝库`,
                    text: `发现了一个超好用的AI工具：${toolName}`,
                    url: shareUrl
                }).catch(err => console.log('分享失败:', err));
            } else {
                // 降级方案：复制链接
                navigator.clipboard.writeText(shareUrl).then(() => {
                    showToast('链接已复制到剪贴板');
                }).catch(() => {
                    showToast('分享功能暂不支持');
                });
            }
        }
        
        // Toast 提示
        function showToast(message) {
            const existingToast = document.querySelector('.toast');
            if (existingToast) {
                existingToast.remove();
            }
            
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = message;
            document.body.appendChild(toast);
            
            setTimeout(() => {
                toast.style.opacity = '0';
                setTimeout(() => toast.remove(), 300);
            }, 2000);
        }
        
        // 收藏功能
        function getFavorites() {
            const saved = localStorage.getItem('favorites');
            return saved ? JSON.parse(saved) : [];
        }
        
        function isFavorite(toolName) {
            const favorites = getFavorites();
            return favorites.includes(toolName);
        }
        
        function toggleFavorite(toolName) {
            let favorites = getFavorites();
            const index = favorites.indexOf(toolName);
            
            if (index > -1) {
                favorites.splice(index, 1);
                showToast('已取消收藏');
            } else {
                favorites.push(toolName);
                showToast('已添加到收藏');
            }
            
            localStorage.setItem('favorites', JSON.stringify(favorites));
            renderTools(); // 重新渲染更新收藏状态
        }
        
        // Toast 提示
        function showToast(message) {
            const existingToast = document.querySelector('.toast');
            if (existingToast) {
                existingToast.remove();
            }
            
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = message;
            document.body.appendChild(toast);
            
            setTimeout(() => {
                toast.style.opacity = '0';
                setTimeout(() => toast.remove(), 300);
            }, 2000);
        }
        
        // 主题切换功能
        const themeToggle = document.getElementById('themeToggle');
        const themeIcon = document.querySelector('.theme-icon');
        
        // 从 localStorage 读取保存的主题
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'dark') {
            document.body.classList.add('dark-mode');
            themeIcon.textContent = '☀️';
        }
        
        themeToggle.addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            themeIcon.textContent = isDark ? '☀️' : '🌙';
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
        });
        
        // 初始化
        renderRanking();
        renderTools();
        setTimeout(lazyLoadImages, 500); // 渲染后启动懒加载
    </script>
</body>
</html>
