        }

            font-weight: 600;
            cursor: pointer;

        .ranking-item:hover {

            font-size: 24px;
            font-weight: 800;
            margin-right: 20px;

        }

            border-radius: 12px;
        }

            background: linear-gradient(135deg, #cd7f32 0%, #b87333 100%);

            border-radius: 12px;
        }
        
        .ranking-rank.normal {
            color: #999;
            font-size: 18px;
        }
        
        .ranking-icon {
            width: 60px;
            height: 60px;
            border-radius: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            margin-right: 20px;
            flex-shrink: 0;

        }
        
        .ranking-name {
            font-size: 18px;
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
        }
        
        .ranking-desc {
            font-size: 14px;
            color: #666;
            margin-bottom: 8px;
        }
        
        .ranking-meta {
            display: flex;
            gap: 15px;
            font-size: 13px;
            color: #999;
        }
        
        .ranking-meta span {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .ranking-action {
            margin-left: 20px;
        }

            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;

            display: inline-block;
            margin-bottom: 20px;
            color: #667eea;
            text-decoration: none;
            font-weight: 500;
        }

        }

            justify-content: center;

            margin-bottom: 30px;

        function getRankClass(index) {
            if (index === 0) return 'gold';
            if (index === 1) return 'silver';
            if (index === 2) return 'bronze';
            return 'normal';
        }
        
        function renderRanking(type) {
            const list = rankingData[type];
            const container = document.getElementById('rankingList');
            
            container.innerHTML = list.map((tool, index) => `
                <div class="ranking-item">
                    <div class="ranking-rank ${getRankClass(index)}">${index + 1}</div>
                    <div class="ranking-icon">${tool.icon}</div>
                    <div class="ranking-info">
                        <div class="ranking-name">${tool.name}</div>
                        <div class="ranking-desc">${tool.desc}</div>
                        <div class="ranking-meta">
                            <span>⭐ ${tool.rating}</span>
                            <span>👥 ${tool.users}</span>
                            <span>${tool.price === '免费' ? '🆓' : '💰'} ${tool.price}</span>
                        </div>
                    </div>
                    <div class="ranking-action">
                        <a href="${tool.url}" target="_blank" class="visit-btn">访问</a>
                    </div>
                </div>
            `).join('');
        }
        
        function switchTab(type) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            renderRanking(type);
        }
        
        // 默认加载评分排行
