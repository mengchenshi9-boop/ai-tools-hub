        }

            gap: 16px;

            font-weight: 700;
            font-size: 18px;
        }
        
        .tutorial-content {
            flex: 1;
        }
        
        .tutorial-content h3 {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 8px;
        }
        
        .tutorial-content p {
            font-size: 15px;
            color: var(--text-secondary);
            line-height: 1.6;
        }

        // 获取替代工具
        function getAlternatives(currentTool) {
            return tools

                    desc: t.desc.substring(0, 60) + '...',
                    rating: t.rating,
                    price: t.price,
                    icon: t.name.charAt(0)
